services:
  - type: web
    name: structcalc
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run_structural:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
